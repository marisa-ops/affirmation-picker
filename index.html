<style>
/* ============================================================
   THEME TOKENS
   "ink"      — white page, dark ink text directly on it.
   "twilight" — deep soft near-black page, with warm cream
                panels holding all text and interactive sections.
   The affirmation card itself never reads these page tokens for
   its own colours — it always uses the fixed --card-* variables
   below, so it looks identical in both themes.
   ============================================================ */
:root{
  --color-bg:            #17140F;
  --color-text:          #F2ECDF;
  --color-text-muted:    #C9BBA0;
  --color-accent:        #C6A06B;
  --color-accent-soft:   rgba(198,160,107,0.14);
  --color-border:        rgba(198,160,107,0.30);
  --color-button-bg:     #1B1815;
  --color-button-text:   #FBF6EC;
  --footer-bg:           #FBF6EC;
  --footer-border:       rgba(198,160,107,0.4);

  --panel-bg:            #FBF6EC;
  --panel-border:        1px solid rgba(198,160,107,0.45);
  --panel-shadow:        0 20px 46px rgba(0,0,0,0.38), 0 0 0 1px rgba(198,160,107,0.08);
  --panel-padding:       30px 26px;
  --panel-text:          #211D18;
  --panel-text-muted:    #6E6459;
  --panel-inner-border:  #E7DFD2;

  /* fixed card tokens — never overridden per theme */
  --card-bg:             #FFFFFF;
  --card-text:           #211D18;
  --card-border:         #E7DFD2;
  --card-shadow:         0 8px 20px rgba(19,17,16,0.10);

  --font-display: 'Playfair Display', Georgia, serif;
  --font-body:    'Lora', Georgia, serif;
  --font-label:   'Lora', Georgia, serif;
  --font-script:  'Mrs Saint Delafield', cursive;

  --radius-shape: 20px;
  --radius-pill:  999px;
  --max-width:    640px;
}

*{box-sizing:border-box;}

a:focus-visible,
button:focus-visible{
  outline: 2px solid var(--color-accent);
  outline-offset: 3px;
  border-radius: 4px;
}

html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 700px 420px at 50% -6%, rgba(198,160,107,0.13), transparent 65%),
    radial-gradient(ellipse 600px 500px at 90% 100%, rgba(198,160,107,0.06), transparent 60%),
    var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:32px 20px 60px;
  transition:background .35s ease, color .35s ease;
}
.app{ width:100%; max-width:var(--max-width); }

.screen{ display:none; animation:fadeIn .45s ease; }
.screen.active{ display:block; }
@keyframes fadeIn{
  from{opacity:0; transform:translateY(8px);}
  to{opacity:1; transform:translateY(0);}
}
@media (prefers-reduced-motion:reduce){ .screen{ animation:none; } }

/* ---- panel wrapper: inert in Ink, a soft cream card in Twilight ---- */
.panel{
  background:var(--panel-bg);
  border:var(--panel-border);
  box-shadow:var(--panel-shadow);
  border-radius:var(--radius-shape);
  padding:var(--panel-padding);
  --color-text: var(--panel-text);
  --color-text-muted: var(--panel-text-muted);
  --color-border: var(--panel-inner-border);
}

h1.headline{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(26px, 5vw, 36px);
  line-height:1.18;
  text-align:center;
  margin:0 0 16px;
  letter-spacing:-0.01em;
  color:var(--color-text);
}
h1.headline em{ font-style:normal; color:var(--color-accent); }
p.lede{
  font-family:var(--font-body);
  font-size:16.5px;
  line-height:1.6;
  color:var(--color-text-muted);
  text-align:center;
  max-width:480px;
  margin:0 auto 30px;
}

.brand-mark{
  display:block;
  width:116px;
  height:116px;
  margin:0 auto 18px;
  border-radius:50%;
  border:1.5px solid var(--color-accent);
  padding:6px;
  background:var(--card-bg);
  box-shadow:var(--card-shadow);
}
.brand-mark img{ width:100%; height:100%; object-fit:contain; border-radius:50%; }
.brand-mark.small{ width:56px; height:56px; margin-bottom:14px; }

/* ---- Mode picker ---- */
.mode-grid{ display:flex; flex-direction:column; gap:14px; margin-bottom:8px; }
.mode-card{
  display:flex; align-items:center; gap:16px; text-align:left;
  background:var(--color-accent-soft);
  border:1px solid var(--color-border);
  border-radius:16px;
  padding:18px 20px;
  cursor:pointer;
  transition:border-color .18s ease, transform .18s ease, background .18s ease;
  font-family:var(--font-body);
  color:var(--color-text);
}
.mode-card:hover{ border-color:var(--color-accent); transform:translateY(-1px); }
.mode-icon{
  flex:0 0 auto; width:48px; height:48px; border-radius:50%;
  background:var(--card-bg);
  border:1px solid var(--color-border);
  display:flex; align-items:center; justify-content:center;
}
.mode-icon svg{ width:26px; height:26px; display:block; }
.mode-icon svg *{ stroke:var(--color-text); }
.mode-icon svg rect{ fill:var(--card-bg); }
.mode-text strong{
  display:block; font-family:var(--font-display); font-weight:600;
  font-size:17px; color:var(--color-text); margin-bottom:2px;
}
.mode-text span{ font-size:14px; color:var(--color-text-muted); line-height:1.5; }

.back-row{ text-align:center; margin:26px 0 6px; }
.link-btn{
  background:none; border:none; font-family:var(--font-label); font-size:14px;
  color:var(--color-text-muted); text-decoration:underline; cursor:pointer; padding:6px;
}
.link-btn:hover{ color:var(--color-text); }

.btn-primary{
  display:block; width:100%;
  background:var(--color-button-bg); color:var(--color-button-text);
  border:none; border-radius:var(--radius-pill);
  font-family:var(--font-label); font-size:15.5px; letter-spacing:0.01em;
  padding:16px 24px; cursor:pointer; text-align:center;
  transition:transform .15s ease, opacity .15s ease;
}
.btn-primary:hover{ opacity:0.88; transform:translateY(-1px); }
.btn-primary:disabled{ opacity:0.5; cursor:default; transform:none; }

/* ============================================================
   CARD SHAPE — fixed design, identical in both page themes.
   ============================================================ */
.card-scene{ perspective:1400px; }
.card-3d{
  position:relative; width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.34,1.15,.4,1);
}
.card-3d.flipped{ transform:rotateY(180deg); }
.card-face{
  position:absolute; inset:0;
  border-radius:var(--radius-shape);
  backface-visibility:hidden;
  overflow:hidden;
  box-shadow:var(--card-shadow);
  background:var(--card-bg);
}
.card-back{ border:1px solid var(--card-border); }
.card-back img{ width:100%; height:100%; object-fit:cover; display:block; }
.card-front{
  transform:rotateY(180deg);
  border:1.5px solid #C6A06B;
  display:flex; align-items:center; justify-content:center;
}
.card-front-art{ position:absolute; inset:4%; width:92%; height:92%; object-fit:contain; }
.card-front-text{
  position:relative;
  z-index:2;
  font-family:var(--font-display);
  font-weight:700;
  color:var(--card-text);
  text-align:center;
  line-height:1.22;
  font-size:clamp(18px, 4.6vw, 25px);
  padding:0 12%;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.85),
    0 0 14px rgba(255,255,255,0.75),
    0 0 26px rgba(255,255,255,0.55);
}

/* ---- Wheel mode ---- */
.wheel-wrap{ position:relative; width:220px; height:220px; margin:0 auto 10px; cursor:pointer; transition:transform .2s ease; }
.wheel-wrap:hover{ transform:scale(1.015); }
.wheel-wrap:focus-visible{ outline:2px solid var(--color-accent); outline-offset:6px; border-radius:50%; }
.wheel-pointer{
  position:absolute; top:-6px; left:50%; transform:translateX(-50%);
  width:0; height:0;
  border-left:11px solid transparent; border-right:11px solid transparent;
  border-top:18px solid #C6A06B;
  z-index:3;
}
.wheel-disc{
  width:100%; height:100%; border-radius:50%;
  border:3px solid #C6A06B;
  box-shadow:var(--card-shadow);
  background:conic-gradient(
    #F3EBDC 0deg 30deg, #FFFFFF 30deg 60deg,
    #F3EBDC 60deg 90deg, #FFFFFF 90deg 120deg,
    #F3EBDC 120deg 150deg, #FFFFFF 150deg 180deg,
    #F3EBDC 180deg 210deg, #FFFFFF 210deg 240deg,
    #F3EBDC 240deg 270deg, #FFFFFF 270deg 300deg,
    #F3EBDC 300deg 330deg, #FFFFFF 330deg 360deg
  );
  transition: transform 3.2s cubic-bezier(.13,.8,.15,1);
  position:relative;
}
.wheel-center{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:54px; height:54px; border-radius:50%;
  background:#FFFFFF;
  border:1.5px solid #C6A06B;
  display:flex; align-items:center; justify-content:center;
  z-index:2; box-shadow:0 2px 8px rgba(0,0,0,0.18);
  overflow:hidden;
}
.wheel-center img{ width:74%; height:74%; object-fit:contain; }

/* ---- Shuffle mode ---- */
.deck-wrap{ position:relative; width:180px; height:180px; margin:0 auto 14px; cursor:pointer; transition:transform .2s ease; }
.deck-wrap:hover{ transform:translateY(-2px); }
.deck-wrap:focus-visible{ outline:2px solid var(--color-accent); outline-offset:6px; border-radius:20px; }
.deck-card{
  position:absolute; inset:0;
  border-radius:var(--radius-shape);
  background:#FFFFFF;
  border:1px solid #E7DFD2;
  box-shadow:var(--card-shadow);
  overflow:hidden;
  transition:transform .5s ease;
}
.deck-card img{ width:100%; height:100%; object-fit:cover; display:block; }
.deck-card.shuffling{ animation: shuffleFan .78s cubic-bezier(.45,.05,.35,1); }
.deck-card.shuffling:nth-child(1){ animation-delay:0ms; }
.deck-card.shuffling:nth-child(2){ animation-delay:100ms; }
.deck-card.shuffling:nth-child(3){ animation-delay:200ms; }
@keyframes shuffleFan{
  0%{ transform:translate(0,0) rotate(0deg) scale(1); }
  18%{ transform:translate(-32px,-14px) rotate(-17deg) scale(1.03); }
  38%{ transform:translate(28px,10px) rotate(14deg) scale(1.03); }
  58%{ transform:translate(-17px,-7px) rotate(-9deg) scale(1.02); }
  78%{ transform:translate(10px,4px) rotate(5deg) scale(1.01); }
  100%{ transform:translate(0,0) rotate(0deg) scale(1); }
}
@media (prefers-reduced-motion:reduce){ .deck-card.shuffling{ animation:none; } }

/* ---- Spread mode ---- */
.spread-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:8px; }
.spread-cell{
  aspect-ratio:1/1;
  border-radius:14px;
  background:#FFFFFF;
  border:1px solid #E7DFD2;
  cursor:pointer;
  overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, opacity .18s ease;
}
.spread-cell img{ width:100%; height:100%; object-fit:cover; display:block; }
.spread-cell:hover{ transform:translateY(-3px); border-color:#C6A06B; box-shadow:var(--card-shadow); }
.spread-cell.chosen{ border-color:#C6A06B; box-shadow:var(--card-shadow); transform:scale(1.05); }
.spread-cell.dimmed{ opacity:0.32; pointer-events:none; }

.pick-caption{
  text-align:center; font-family:var(--font-body); font-size:14.5px;
  color:var(--color-text-muted); margin:22px 0 4px; min-height:20px;
}
.action-row{ margin-top:22px; }

/* ---- Reveal screen: the card floats freely; kept minimal & atmospheric ---- */
.reveal-card-scene{
  width:min(78vw, 280px);
  height:min(78vw, 280px);
  margin:0 auto 22px;
  cursor:pointer;
}
.reveal-card-scene.awaiting .card-face{ animation: invitePulse 2.4s ease-in-out infinite; }
@keyframes invitePulse{
  0%, 100%{ box-shadow:var(--card-shadow); }
  50%{ box-shadow:0 0 0 10px rgba(198,160,107,0.18), var(--card-shadow); }
}
@media (prefers-reduced-motion:reduce){ .reveal-card-scene.awaiting .card-face{ animation:none; } }

.reveal-prompt{
  font-family:var(--font-label);
  font-size:13px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--color-text-muted);
  text-align:center;
  margin:0 0 22px;
  transition:opacity .3s ease;
}
.reveal-eyebrow{
  font-family:var(--font-label);
  font-size:13px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--color-accent); text-align:center; margin:0 0 16px;
  opacity:0; animation: revealUp .6s ease forwards; animation-delay:.15s;
}
.invitation-text{
  font-family:var(--font-body); font-style:italic; font-size:15px;
  color:var(--color-text-muted); text-align:center; margin:20px auto 30px;
  opacity:0; animation: revealUp .6s ease forwards; animation-delay:.4s;
}
@keyframes revealUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion:reduce){ .reveal-eyebrow, .invitation-text{ opacity:1; animation:none; } }
.reveal-actions{ max-width:320px; margin:0 auto; }
.reveal-hidden{ display:none; }

@media (max-width:480px){
  body{ padding:20px 16px 40px; }
  .wheel-wrap{ width:200px; height:200px; }
}

/* ---- Footer ---- */
.site-footer{
  width:100%; max-width:var(--max-width);
  margin:44px auto 0;
  padding:26px 20px 30px;
  background:var(--footer-bg);
  border:1px solid var(--footer-border);
  border-radius:16px;
  text-align:center;
}
.footer-copyright{ font-family:var(--font-label); font-size:11.5px; color:var(--panel-text-muted); margin:0 0 10px; }
.footer-disclaimer{
  font-family:var(--font-body); font-size:10.5px; line-height:1.6;
  color:var(--panel-text-muted); opacity:0.85; max-width:460px; margin:0 auto 14px;
}
.footer-links{ font-family:var(--font-label); font-size:11px; color:var(--panel-text-muted); margin:0; }
.footer-links a{ color:var(--panel-text-muted); text-decoration:underline; text-underline-offset:2px; transition:color .15s ease; }
.footer-links a:hover{ color:var(--color-accent); }
.footer-links .sep{ margin:0 8px; opacity:.5; }

@media (max-width:480px){ .site-footer{ padding:22px 16px 26px; } }
</style>

/* ---- shared draw-without-repeat pool ---- */
function makePool(){
  let pool = [];
  function refill(){
    pool = AFFIRMATIONS.map((_, i) => i);
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }
  refill();
  return function draw(){
    if(pool.length === 0) refill();
    return pool.pop();
  };
}
const drawNext = makePool();

const screensEl = document.getElementById('screens');

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function backToPickerRow(){
  return `<div class="back-row"><button class="link-btn" data-goto-picker>\u2190 Choose a different way</button></div>`;
}
function wireBackLinks(scope){
  scope.querySelectorAll('[data-goto-picker]').forEach(btn => {
    btn.addEventListener('click', () => showScreen('screen-picker'));
  });
}

/* ================= Screen 1: opening / mode picker ================= */
function buildPickerScreen(){
  const div = document.createElement('div');
  div.className = 'screen active';
  div.id = 'screen-picker';
  div.innerHTML = `
    <div class="brand-mark"><img src="${EMBLEM_SRC}" alt="Kokon Coaching"></div>
    <div class="panel">
      <h1 class="headline">Pick an <em>affirmation</em> card</h1>
      <p class="lede">Choose how you'd like to draw your card \u2014 then let your affirmation find you today.</p>
      <div class="mode-grid">
        <button class="mode-card" data-mode="wheel">
          <span class="mode-icon">${ICONS.wheel}</span>
          <span class="mode-text"><strong>Spin the wheel</strong><span>Give it a spin and see where it lands.</span></span>
        </button>
        <button class="mode-card" data-mode="shuffle">
          <span class="mode-icon">${ICONS.shuffle}</span>
          <span class="mode-text"><strong>Shuffle the deck</strong><span>Shuffle the cards, then draw the top one.</span></span>
        </button>
        <button class="mode-card" data-mode="spread">
          <span class="mode-icon">${ICONS.spread}</span>
          <span class="mode-text"><strong>Choose from a spread</strong><span>A few cards are laid out. Pick one.</span></span>
        </button>
      </div>
    </div>
  `;
  screensEl.appendChild(div);
  div.querySelectorAll('.mode-card').forEach(btn => {
    btn.addEventListener('click', () => goToMode(btn.getAttribute('data-mode')));
  });
}

function goToMode(mode){
  if(mode === 'wheel') showScreen('screen-wheel');
  if(mode === 'shuffle') showScreen('screen-shuffle');
  if(mode === 'spread'){ resetSpread(); showScreen('screen-spread'); }
}

/* ================= Screen 2a: pick — spin the wheel ================= */
function buildWheelScreen(){
  const div = document.createElement('div');
  div.className = 'screen';
  div.id = 'screen-wheel';
  div.innerHTML = `
    <div class="panel">
      <div class="brand-mark small"><img src="${EMBLEM_SRC}" alt="Kokon Coaching"></div>
      <div class="wheel-wrap" id="wheelWrap" role="button" tabindex="0" aria-label="Spin the wheel">
        <div class="wheel-pointer"></div>
        <div class="wheel-disc" id="wheelDisc">
          <div class="wheel-center"><img src="${EMBLEM_SRC}" alt=""></div>
        </div>
      </div>
      <p class="pick-caption" id="wheelCaption">Give it a spin.</p>
    </div>
    ${backToPickerRow()}
  `;
  screensEl.appendChild(div);
  wireBackLinks(div);

  const wrap = div.querySelector('#wheelWrap');
  const disc = div.querySelector('#wheelDisc');
  const caption = div.querySelector('#wheelCaption');
  let totalRotation = 0;
  let spinning = false;

  function doSpin(){
    if(spinning) return;
    spinning = true;
    caption.textContent = '';
    const extraSpins = 5 + Math.floor(Math.random()*3);
    const randomOffset = Math.random()*360;
    totalRotation += extraSpins*360 + randomOffset;
    disc.style.transform = `rotate(${totalRotation}deg)`;
    setTimeout(() => {
      const idx = drawNext();
      spinning = false;
      showReveal(idx);
    }, 3300);
  }

  wrap.addEventListener('click', doSpin);
  wrap.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      doSpin();
    }
  });
}

/* ================= Screen 2b: pick — shuffle the deck ================= */
function buildShuffleScreen(){
  const div = document.createElement('div');
  div.className = 'screen';
  div.id = 'screen-shuffle';
  div.innerHTML = `
    <div class="panel">
      <div class="brand-mark small"><img src="${EMBLEM_SRC}" alt="Kokon Coaching"></div>
      <div class="deck-wrap" id="deckWrap" role="button" tabindex="0" aria-label="Shuffle the deck">
        <div class="deck-card" style="transform:translate(6px,6px) rotate(3deg);"><img src="${CARDBACK_SRC}" alt=""></div>
        <div class="deck-card" style="transform:translate(-5px,4px) rotate(-2deg);"><img src="${CARDBACK_SRC}" alt=""></div>
        <div class="deck-card"><img src="${CARDBACK_SRC}" alt=""></div>
      </div>
      <p class="pick-caption" id="shuffleCaption">Give the deck a shuffle.</p>
    </div>
    ${backToPickerRow()}
  `;
  screensEl.appendChild(div);
  wireBackLinks(div);

  const wrap = div.querySelector('#deckWrap');
  const deckCards = Array.from(div.querySelectorAll('.deck-card'));
  const caption = div.querySelector('#shuffleCaption');
  let busy = false;

  function doShuffle(){
    if(busy) return;
    busy = true;
    caption.textContent = '';
    deckCards.forEach(c => {
      c.classList.remove('shuffling');
      void c.offsetWidth;
      c.classList.add('shuffling');
    });
    setTimeout(() => {
      const idx = drawNext();
      busy = false;
      showReveal(idx);
    }, 1150);
  }

  wrap.addEventListener('click', doShuffle);
  wrap.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      doShuffle();
    }
  });
}

/* ================= Screen 2c: pick — choose from a spread ================= */
function resetSpread(){
  const grid = document.getElementById('spreadGrid');
  if(!grid) return;
  const caption = document.getElementById('spreadCaption');
  caption.textContent = 'Tap a card to choose it.';

  const pool = AFFIRMATIONS.map((_, i) => i);
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const idxs = pool.slice(0, 9);

  grid.innerHTML = idxs.map((affIdx, cellIdx) => `
    <div class="spread-cell" data-cell="${cellIdx}" data-idx="${affIdx}">
      <img src="${CARDBACK_SRC}" alt="">
    </div>
  `).join('');

  let chosen = false;
  grid.querySelectorAll('.spread-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      if(chosen) return;
      chosen = true;
      const idx = parseInt(cell.getAttribute('data-idx'), 10);
      grid.querySelectorAll('.spread-cell').forEach(c => { if(c !== cell) c.classList.add('dimmed'); });
      cell.classList.add('chosen');
      caption.textContent = '';
      setTimeout(() => showReveal(idx), 550);
    });
  });
}

function buildSpreadScreen(){
  const div = document.createElement('div');
  div.className = 'screen';
  div.id = 'screen-spread';
  div.innerHTML = `
    <div class="panel">
      <div class="brand-mark small"><img src="${EMBLEM_SRC}" alt="Kokon Coaching"></div>
      <div class="spread-grid" id="spreadGrid"></div>
      <p class="pick-caption" id="spreadCaption"></p>
    </div>
    ${backToPickerRow()}
  `;
  screensEl.appendChild(div);
  wireBackLinks(div);
}

/* ================= Screen 3: reveal — floats freely, no panel ================= */
function buildRevealScreen(){
  const div = document.createElement('div');
  div.className = 'screen';
  div.id = 'screen-reveal';
  div.innerHTML = `
    <p class="reveal-eyebrow reveal-hidden" id="revealEyebrow">Your affirmation</p>
    <p class="reveal-prompt" id="revealPrompt">Tap the card to reveal your affirmation</p>
    <div class="card-scene reveal-card-scene awaiting" id="revealCardScene">
      <div class="card-3d" id="revealCard3d">
        <div class="card-face card-back"><img src="${CARDBACK_SRC}" alt=""></div>
        <div class="card-face card-front">
          <img class="card-front-art" src="${CARDFRONT_SRC}" alt="">
          <div class="card-front-text" id="affirmationText"></div>
        </div>
      </div>
    </div>
    <p class="invitation-text reveal-hidden" id="invitationText">Take a breath. Read it again. Let it land.</p>
    <div class="reveal-actions reveal-hidden" id="revealActions">
      <button class="btn-primary" id="anotherCardBtn">Choose another card</button>
    </div>
    ${backToPickerRow()}
  `;
  screensEl.appendChild(div);
  wireBackLinks(div);

  const scene = div.querySelector('#revealCardScene');
  const card3d = div.querySelector('#revealCard3d');
  const prompt = div.querySelector('#revealPrompt');
  const eyebrow = div.querySelector('#revealEyebrow');
  const invitation = div.querySelector('#invitationText');
  const actions = div.querySelector('#revealActions');

  scene.addEventListener('click', () => {
    if(card3d.classList.contains('flipped')) return;
    scene.classList.remove('awaiting');
    card3d.classList.add('flipped');
    prompt.style.opacity = '0';
    setTimeout(() => { prompt.classList.add('reveal-hidden'); }, 300);
    setTimeout(() => {
      [eyebrow, invitation, actions].forEach(el => {
        el.classList.remove('reveal-hidden');
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
    }, 350);
  });

  div.querySelector('#anotherCardBtn').addEventListener('click', () => showScreen(lastPickScreen));
}

let lastPickScreen = 'screen-picker';

function showReveal(idx){
  const scene = document.getElementById('revealCardScene');
  const card3d = document.getElementById('revealCard3d');
  const text = document.getElementById('affirmationText');
  const prompt = document.getElementById('revealPrompt');
  const eyebrow = document.getElementById('revealEyebrow');
  const invitation = document.getElementById('invitationText');
  const actions = document.getElementById('revealActions');

  card3d.classList.remove('flipped');
  scene.classList.add('awaiting');
  prompt.style.opacity = '1';
  prompt.classList.remove('reveal-hidden');
  [eyebrow, invitation, actions].forEach(el => el.classList.add('reveal-hidden'));
  text.textContent = AFFIRMATIONS[idx];

  showScreen('screen-reveal');
}

const _origShowScreen = showScreen;
showScreen = function(id){
  _origShowScreen(id);
  if(id === 'screen-wheel' || id === 'screen-shuffle' || id === 'screen-spread'){
    lastPickScreen = id;
  }
};

/* ---- Build ---- */
buildPickerScreen();
buildWheelScreen();
buildShuffleScreen();
buildSpreadScreen();
buildRevealScreen();
renderFooter();
</script>
